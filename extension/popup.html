<!doctype html>
<meta charset="utf-8">
<title>BreakTension</title>
<style>
  :root { --bg:#0b0f0c; --ink:#e9f1ea; --muted:#92a69a; --line:#24312a; --grass:#5fd38a; }
  body { width:280px; margin:0; padding:16px; background:var(--bg); color:var(--ink);
         font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI",sans-serif; }
  .eyebrow { font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  h1 { font-size:16px; margin:4px 0 14px; font-weight:650; }
  .big { font-size:30px; font-weight:650; letter-spacing:-.02em; }
  .big span { font-size:14px; font-weight:400; color:var(--muted); }
  .bar { height:6px; background:#18211b; border-radius:99px; overflow:hidden; margin:10px 0 4px; }
  .bar i { display:block; height:100%; background:var(--grass); width:0; transition:width .3s; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:8px;
         padding:9px 0; border-top:1px solid var(--line); font-size:13px; }
  .row:first-of-type { margin-top:12px; }
  .muted { color:var(--muted); }
  .dot { width:7px; height:7px; border-radius:50%; display:inline-block; }
  .up { background:var(--grass); } .down { background:#f07a6a; }
  button { width:100%; margin-top:12px; font:inherit; font-weight:600; border:0;
           border-radius:10px; padding:11px; background:var(--grass); color:#06281a; cursor:pointer; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--ink); margin-top:8px; }
  a { color:var(--muted); font-size:12px; display:block; margin-top:12px; text-align:center; }
</style>
<div class="eyebrow">BreakTension</div>
<h1>Desk time</h1>
<div class="big" id="left">—<span> min left</span></div>
<div class="bar"><i id="fill"></i></div>

<div class="row"><span class="muted">Verifier</span><span><span class="dot" id="srvdot"></span> <span id="srv">checking…</span></span></div>
<div class="row"><span class="muted">Status</span><span id="state">—</span></div>

<button id="force">Take a break now</button>
<button class="ghost" id="toggle">Pause</button>
<a href="#" id="opts">Settings</a>

<script src="popup.js"></script>
